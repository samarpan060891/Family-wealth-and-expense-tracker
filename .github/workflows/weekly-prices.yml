name: Weekly price update

# Refreshes market-linked investment values once a week by calling the app's
# protected cron endpoint. Requires two repository secrets:
#   APP_URL      e.g. https://family-wealth-and-expense-tracker-production.up.railway.app
#   CRON_SECRET  the same value set as CRON_SECRET in the app's environment (Railway)
on:
  schedule:
    - cron: "0 2 * * 1" # every Monday 02:00 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger price refresh
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST "$APP_URL/api/cron/update-prices" \
            -H "x-cron-secret: $CRON_SECRET" \
            -w "\nHTTP %{http_code}\n"
